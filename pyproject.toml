[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presence-panel"
version = "1.2.0"
description = "Local-first control panel for your social accounts: one registry, setup checklists and metric tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SMOUJ" }]
keywords = ["social-media", "local-first", "dashboard", "self-hosted", "metrics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Internet",
]
dependencies = []

[project.scripts]
presence = "presence.cli:main"

[project.urls]
Homepage = "https://github.com/smouj/presence"
Issues = "https://github.com/smouj/presence/issues"

[tool.setuptools]
packages = ["presence"]

[tool.setuptools.package-data]
presence = ["web/*", "data/*"]
