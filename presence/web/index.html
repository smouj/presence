<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presence — social account control</title>
<meta name="description" content="Local-first control panel for your social accounts: one registry, setup checklists and metric tracking. No account, no telemetry, no publishing.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <div class="brand">Presence<span>· social accounts</span></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="q" type="search" placeholder="Search platform, handle or task…" autocomplete="off" aria-label="Search">
  </div>
  <div class="actions">
    <button class="btn" id="collect">Collect</button>
    <button class="btn ghost" id="export">CSV</button>
  </div>
</div>

<section class="kpis" id="kpis"></section>

<div class="toolbar">
  <div class="chips" id="chips"></div>
  <div class="spacer"></div>
  <select class="select" id="sort" aria-label="Sort">
    <option value="priority">Priority</option>
    <option value="name">Name</option>
    <option value="pending">Open tasks</option>
    <option value="metric">Setup health</option>
  </select>
</div>

<main class="grid" id="grid"></main>

<footer>
  Presence only reads. It never publishes, schedules or edits a remote profile.
  <strong>AUTO</strong> metrics come from public APIs; <strong>MANUAL</strong> platforms are tracked by hand.
  Configuration changes are written to <code>accounts.json</code> after a backup.
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
