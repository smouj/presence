<!doctype html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presence — social account control</title>
<meta name="description" content="Local-first control panel for your social accounts: one registry, setup checklists and metric tracking. No account, no telemetry, no publishing.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="hud">
  <div class="logo">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
        <path d="M30 20.5a14 14 0 0 1 0 23"/>
        <path d="M34.6 14a22 22 0 0 1 0 36"/>
      </g>
      <circle cx="22" cy="32" r="5.5" fill="currentColor"/>
    </svg>
    Presence <span class="ver">1.2.0</span>
  </div>

  <div class="search">
    <span id="searchicon"></span>
    <input id="q" type="search" placeholder="Search platform, handle or task…" autocomplete="off" aria-label="Search">
  </div>

  <div class="hud-right">
    <button class="iconbtn" id="accent" title="Change accent" aria-label="Change accent">◐</button>
    <button class="iconbtn" id="theme" title="Switch theme" aria-label="Switch theme"></button>
    <button class="btn" id="collect"></button>
    <button class="btn ghost" id="export" title="Export CSV" aria-label="Export CSV">CSV</button>
  </div>
</header>

<section class="hero" id="hero"></section>

<div class="toolbar">
  <div class="chips" id="chips"></div>
  <div class="spacer"></div>
  <select class="select" id="sort" aria-label="Sort">
    <option value="priority">Group by priority</option>
    <option value="health">Setup health</option>
    <option value="pending">Open tasks</option>
    <option value="name">Name</option>
  </select>
</div>

<main id="grid"></main>

<footer>
  Presence only reads. It never publishes, schedules or edits a remote profile.
  <strong>AUTO</strong> metrics come from public APIs; <strong>MANUAL</strong> platforms are tracked by hand.
  Configuration changes are written to <code>accounts.json</code> after a backup.
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
